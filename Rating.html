<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate My Painting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }
  .card img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
  p  { color: #777; margin-bottom: 24px; }
  .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .stars button {
    font-size: 36px;
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    transition: transform 0.15s, color 0.15s;
  }
  .stars button:hover { transform: scale(1.25); }
  .stars button.active { color: #f5b301; }
  textarea {
    width: 100%;
    height: 80px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    resize: vertical;
    margin-bottom: 20px;
  }
  .submit-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    padding: 12px 40px;
    font-size: 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hidden { display: none; }
  .thanks { font-size: 20px; color: #4caf50; margin-top: 40px; }
</style>
</head>
<body>
  <div class="card">
    <div id="form-view">
      <!-- Replace src with your painting image link -->
      <img src="https://www.paisawapas.com/p-abstract-modern-art-canvas-painting-canvas-art16-inch-x-24-inch-rolled-5808279" alt="Painting">
      <h1>Rate My Painting</h1>
      <p>How much do you like it?</p>

      <div class="stars" id="stars">
        <button data-value="1">★</button>
        <button data-value="2">★</button>
        <button data-value="3">★</button>
        <button data-value="4">★</button>
        <button data-value="5">★</button>
      </div>

      <textarea id="comment" placeholder="Leave a comment (optional)..."></textarea>

      <button class="submit-btn" id="submitBtn" disabled>Submit Rating</button>
    </div>

    <div id="thanks-view" class="hidden">
      <div class="thanks">✓ Thank you for rating!</div>
      <p style="margin-top:10px;">Your feedback means a lot. 🎨</p>
    </div>
  </div>

<script>
  let rating = 0;
  const stars = document.querySelectorAll('#stars button');
  const submitBtn = document.getElementById('submitBtn');

  stars.forEach(btn => {
    btn.addEventListener('click', () => {
      rating = parseInt(btn.dataset.value);
      stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.value) <= rating));
      submitBtn.disabled = false;
    });
  });

  submitBtn.addEventListener('click', () => {
    const comment = document.getElementById('comment').value;
    // For now just show the result in console. See note below for sending to Google Sheets.
    console.log("Rating:", rating, "Comment:", comment);
    document.getElementById('form-view').classList.add('hidden');
    document.getElementById('thanks-view').classList.remove('hidden');
  });
</script>
</body>
</html>
